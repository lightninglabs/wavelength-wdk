name: CI

# Lint, types and tests for the wallet package, the example app's worklet
# bundle, and a build of the iOS addon. Nothing here builds a device app, and
# the daemon binaries are fetched, not built.
on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  wallet:
    name: wdk-wallet-wavelength
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install
        run: npm ci

      - name: Lint
        working-directory: wdk-wallet-wavelength
        run: npm run lint

      - name: Typecheck
        working-directory: wdk-wallet-wavelength
        run: npm run typecheck

      # Includes the check that every Lightning Labs SDK pin agrees with the
      # daemon release the binary checksums are keyed by.
      - name: Test
        working-directory: wdk-wallet-wavelength
        run: npm test

  example:
    name: Example app bundles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install
        run: npm ci

      # The worklet bundle is the one artifact that silently rots: it
      # resolves export conditions at pack time, so a change to them shows up
      # here and nowhere else.
      - name: Build the worklet bundle
        working-directory: example/wdk-mobile
        run: npm run build:worklet-bundle

      - name: Test
        working-directory: example/wdk-mobile
        run: npm test

  addon:
    name: iOS addon
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # The install scripts' downloads are best effort and only the
      # xcframework is needed here, which the build stages itself.
      - name: Install
        run: npm ci --ignore-scripts

      # Compiles binding.mm against the paired daemon's headers, so a
      # binding change or a changed Mobile* signature fails here instead of
      # in an app. The release workflow builds the published prebuilds the
      # same way.
      - name: Build the prebuilds
        run: npm run build:native -w wavelength-bare-addon
